<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Web fonts are network-backed and non-essential for first paint. A plain
      render-blocking stylesheet would also hold back the deferred module
      script below (scripts wait for pending stylesheets), so an offline or
      captive network could leave the boot splash up until the request timed
      out. Preload keeps the fetch at normal priority without blocking, then
      the sheet is promoted once it arrives.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Inter:opsz,wght@14..32,100..900&display=swap"
      rel="preload"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Inter:opsz,wght@14..32,100..900&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Synara</title>
    <script>
      /* Pin the colour scheme before the bundle runs.
         Without this the document stays on `color-scheme: light dark` until
         `useTheme` hydrates from localStorage, and a dark install flashes the
         light canvas first. Only the mode is read here — surfaces, theme packs,
         and font sizes stay owned by `applyThemeState`, so nothing duplicates the
         theme engine and drifts from it. */
      (function () {
        try {
          var raw = localStorage.getItem("synara:theme");
          var mode = null;
          if (raw === "light" || raw === "dark" || raw === "system") {
            mode = raw;
          } else if (raw) {
            var parsed = JSON.parse(raw);
            if (
              parsed &&
              (parsed.mode === "light" || parsed.mode === "dark" || parsed.mode === "system")
            ) {
              mode = parsed.mode;
            }
          }
          if (!mode) {
            return;
          }
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch {
          /* Blocked storage or malformed state: fall through to the default below. */
        }
      })();
    </script>
    <style>
      /* Boot splash — shown while the JS bundle is parsing and React mounts.
         React's createRoot(...).render(...) wipes #root's children, so no teardown needed. */
      html,
      body {
        margin: 0;
        padding: 0;
        /* Fallback only: the inline script above pins this from the stored mode.
         Kept as `light dark` so an unpinned first paint still follows the OS. */
        color-scheme: light dark;
      }
      /* Only `html`: an unlayered `body` background here would override the layered
         `body` rule in index.css that paints the whole-window glass coat. */
      html {
        background: transparent;
      }
      #root {
        min-height: 100vh;
      }
      .app-boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: drag;
        pointer-events: none;
      }
      .app-boot-splash__icon {
        width: 112px;
        height: 112px;
        opacity: 0;
        transform: scale(0.96);
        animation:
          app-boot-splash-in 420ms ease-out forwards,
          app-boot-splash-pulse 2.4s ease-in-out 420ms infinite;
      }
      @keyframes app-boot-splash-in {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes app-boot-splash-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.98);
          opacity: 0.85;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-splash__icon {
          animation: app-boot-splash-in 200ms ease-out forwards;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-splash" aria-hidden="true">
        <img class="app-boot-splash__icon" src="/synara-logo.svg" alt="" draggable="false" />
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
